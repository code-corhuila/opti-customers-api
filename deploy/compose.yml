# The service of the customers domain. Reachable only inside the platform network: no published port.
name: opti-customers-api

services:
  customers-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: opti/customers-api:local
    environment:
      DATABASE_URL: jdbc:postgresql://customers-db:5432/${CUSTOMERS_DB_NAME:-customers}
      DATABASE_USER: ${CUSTOMERS_DB_USER:-customers_owner}
      DATABASE_PASSWORD: ${CUSTOMERS_DB_PASSWORD:?set CUSTOMERS_DB_PASSWORD in .env}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?set JWT_PUBLIC_KEY (public key of the identity service)}
    networks:
      - platform
    expose:
      - "8080"
    restart: unless-stopped

networks:
  platform:
    external: true
